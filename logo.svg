      <stop offset=".55" stop-color="#121118"/>
      <stop offset="1" stop-color="#08080c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe3b0"/>
